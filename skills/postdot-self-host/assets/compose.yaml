services:
    postdot:
        image: ${POSTDOT_IMAGE:-${POSTBOT_IMAGE:-postdot:local}}
        build:
            context: .
        init: true
        restart: unless-stopped
        stop_grace_period: 30s
        ports:
            - '127.0.0.1:${POSTDOT_HTTP_PORT:-${POSTBOT_HTTP_PORT:-3000}}:3000'
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: '3000'
            DB_FILE_NAME: /data/postdot.sqlite
            POSTDOT_MIGRATIONS_DIR: /app/migrations
            POSTDOT_WEB_ASSETS_DIR: /app/public
            POSTDOT_MEDIA_DIRECTORY: /data/media
            LOG_PRETTY: 'false'
        volumes:
            - postdot-data:/data

volumes:
    postdot-data:
        name: ${POSTDOT_DATA_VOLUME:-postdot-data}
