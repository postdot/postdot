<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Postbot — one post, multiple destinations</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #f4f4f4;
            color: #1c1c1c;
            font:
                16px/1.6 'Host Grotesk',
                sans-serif;
        }
        header {
            padding: 32px 5vw;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0;
        }
        header p {
            font-size: 14px;
            color: #666;
            margin: 8px 0;
        }
        .views {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .view {
            padding: 24px;
            min-height: 380px;
            display: grid;
            place-items: center;
            --face: #fff;
            --side: #e9e9e9;
            --edge: #bcbcbc;
            --ink: #777;
            --blue: #2457d6;
            --wash: #e8efff;
        }
        .dark {
            background: #171717;
            --face: #202020;
            --side: #1b1b1b;
            --edge: #484848;
            --ink: #aaa;
            --blue: #94b5ff;
            --wash: #26334e;
        }
        .view > svg {
            width: 100%;
            max-width: 640px;
            overflow: visible;
        }
        .face {
            fill: var(--face);
            stroke: var(--edge);
            stroke-width: 0.7;
            stroke-linejoin: round;
        }
        .side {
            fill: var(--side);
            stroke: var(--edge);
            stroke-width: 0.7;
            stroke-linejoin: round;
        }
        .rule {
            stroke: var(--ink);
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0.5;
        }
        .image {
            fill: var(--wash);
        }
        .accent {
            stroke: var(--blue);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .connector {
            stroke: var(--edge);
            stroke-width: 1;
            fill: none;
        }
        .flow {
            stroke: var(--blue);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 24 190;
            animation: send 4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
        }
        .flow.second {
            animation-delay: 0.35s;
        }
        .flow.third {
            animation-delay: 0.7s;
        }
        .badge {
            fill: var(--face);
            stroke: var(--edge);
            stroke-width: 0.7;
        }
        .brand {
            fill: var(--blue);
        }
        .destination {
            animation: separate 4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
        }
        .destination.first {
            --lift: -18px;
        }
        .destination.second {
            --lift: 0px;
        }
        .destination.third {
            --lift: 18px;
        }
        @keyframes separate {
            0%,
            15%,
            100% {
                transform: translateY(0);
            }
            45%,
            75% {
                transform: translateY(var(--lift));
            }
        }
        footer {
            padding: 24px 5vw;
            font-size: 13px;
            color: #666;
        }
        @keyframes send {
            0%,
            15% {
                stroke-dashoffset: 190;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            65% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
            75%,
            100% {
                stroke-dashoffset: 0;
                opacity: 0;
            }
        }
        @keyframes receive {
            0%,
            45%,
            100% {
                opacity: 0.55;
            }
            65%,
            85% {
                opacity: 1;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .flow {
                display: none;
            }
            .destination {
                animation: none;
            }
        }
        @media (max-width: 800px) {
            .views {
                grid-template-columns: 1fr;
            }
            .view {
                padding: 24px 8px;
                min-height: 320px;
            }
        }
    </style>
    <header>
        <h1>Write once. Publish across your networks.</h1>
        <p>Illustration study · one source, three destinations</p>
    </header>
    <main class="views">
        <div class="view" id="light"></div>
        <div class="view dark" id="dark"></div>
    </main>
    <footer>
        SVG illustration with a fixed camera. Animation respects reduced motion. Not integrated into
        the homepage.
    </footer>
    <script>
        const geometry = `<svg viewBox="0 0 640 390" role="img" aria-label="One post branches into versions for X, LinkedIn and Bluesky">
<defs><g id="post"><path class="side" d="M0 0L126 63L126 69L0 6Z M126 63L204 24L204 30L126 69Z"/><path class="face" d="M0 0L78 -39L204 24L126 63Z"/><g transform="matrix(.866 .433 -.866 .433 78 -29)"><rect class="image" width="120" height="34" rx="2"/><path class="accent" d="M10 24L32 10L55 23L79 7L109 21"/><path class="rule" d="M0 46H114 M0 55H94 M0 64H70"/></g></g></defs>
<path class="connector" d="M238 186L289 211L357 155 M238 186L289 211L357 205 M238 186L289 211L357 255"/>
<path class="flow" pathLength="190" d="M238 186L289 211L357 155"/><path class="flow second" pathLength="190" d="M238 186L289 211L357 205"/><path class="flow third" pathLength="190" d="M238 186L289 211L357 255"/>
<g transform="translate(34 162)"><use href="#post"/></g>
<!-- Same footprint, different height. Lowest plate first; opaque upper plates hide rear edges. -->
<g transform="translate(357 255)"><g class="destination third"><use href="#post"/><path class="connector" d="M204 28H210"/><svg x="214" y="20" width="22" height="22" viewBox="0 0 256 226" aria-hidden="true"><path fill="#1185fe" d="M55.491 15.172c29.35 22.035 60.917 66.712 72.509 90.686c11.592-23.974 43.159-68.651 72.509-90.686C221.686-.727 256-13.028 256 26.116c0 7.818-4.482 65.674-7.111 75.068c-9.138 32.654-42.436 40.983-72.057 35.942c51.775 8.812 64.946 38 36.501 67.187c-54.021 55.433-77.644-13.908-83.696-31.676c-1.11-3.257-1.63-4.78-1.637-3.485c-.008-1.296-.527.228-1.637 3.485c-6.052 17.768-29.675 87.11-83.696 31.676c-28.445-29.187-15.274-58.375 36.5-67.187c-29.62 5.041-62.918-3.288-72.056-35.942C4.482 91.79 0 33.934 0 26.116C0-13.028 34.314-.727 55.491 15.172"/></svg></g></g><g transform="translate(357 205)"><g class="destination second"><use href="#post"/><path class="connector" d="M204 28H210"/><svg x="214" y="20" width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><path fill="#0a66c2" d="M218.123 218.127h-37.931v-59.403c0-14.165-.253-32.4-19.728-32.4c-19.756 0-22.779 15.434-22.779 31.369v60.43h-37.93V95.967h36.413v16.694h.51a39.91 39.91 0 0 1 35.928-19.733c38.445 0 45.533 25.288 45.533 58.186zM56.955 79.27c-12.157.002-22.014-9.852-22.016-22.009s9.851-22.014 22.008-22.016c12.157-.003 22.014 9.851 22.016 22.008A22.013 22.013 0 0 1 56.955 79.27m18.966 138.858H37.95V95.967h37.97zM237.033.018H18.89C8.58-.098.125 8.161-.001 18.471v219.053c.122 10.315 8.576 18.582 18.89 18.474h218.144c10.336.128 18.823-8.139 18.966-18.474V18.454c-.147-10.33-8.635-18.588-18.966-18.453"/></svg></g></g><g transform="translate(357 155)"><g class="destination first"><use href="#post"/><path class="connector" d="M204 28H210"/><svg x="214" y="20" width="22" height="22" viewBox="0 0 251 256" aria-hidden="true"><path d="M149.079 108.399L242.33 0h-22.098l-80.97 94.12L74.59 0H0l97.796 142.328L0 256h22.1l85.507-99.395L175.905 256h74.59L149.073 108.399zM118.81 143.58l-9.909-14.172l-78.84-112.773h33.943l63.625 91.011l9.909 14.173l82.705 118.3H186.3l-67.49-96.533z"/></svg></g></g></svg>`
        for (const id of ['light', 'dark'])
            document.getElementById(id).innerHTML = geometry
                .replaceAll('id="post"', `id="post-${id}"`)
                .replaceAll('href="#post"', `href="#post-${id}"`)
        const observer = new IntersectionObserver(entries => {
            for (const entry of entries)
                for (const el of entry.target.querySelectorAll('.flow,.destination'))
                    el.style.animationPlayState =
                        entry.isIntersecting && !document.hidden ? 'running' : 'paused'
        })
        for (const view of document.querySelectorAll('.view')) observer.observe(view)
        document.addEventListener('visibilitychange', () => {
            for (const el of document.querySelectorAll('.flow,.destination'))
                el.style.animationPlayState = document.hidden ? 'paused' : 'running'
        })
    </script>
</html>
