<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Postbot — one post, multiple destinations</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #f4f4f4;
            color: #1c1c1c;
            font:
                16px/1.6 'Host Grotesk',
                sans-serif;
        }
        header {
            padding: 32px 5vw;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0;
        }
        header p {
            font-size: 14px;
            color: #666;
            margin: 8px 0;
        }
        .views {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .view {
            padding: 24px;
            min-height: 400px;
            display: grid;
            place-items: center;
            --face: #fff;
            --edge: #bcbcbc;
            --ink: #777;
            --blue: #2457d6;
            --wash: #e8efff;
            color: #1c1c1c;
        }
        .dark {
            background: #171717;
            --face: #202020;
            --edge: #575757;
            --ink: #aaa;
            --blue: #94b5ff;
            --wash: #26334e;
            color: #f4f4f4;
        }
        .view > svg {
            width: 100%;
            max-width: 640px;
            overflow: visible;
        }
        .sil {
            fill: var(--face);
            stroke: var(--edge);
            stroke-width: 0.65;
            stroke-linejoin: round;
        }
        .crease {
            fill: none;
            stroke: var(--edge);
            stroke-width: 0.45;
            opacity: 0.65;
        }
        .rule {
            fill: none;
            stroke: var(--ink);
            stroke-width: 1.1;
            stroke-linecap: round;
            opacity: 0.5;
        }
        .image {
            fill: var(--wash);
            stroke: none;
        }
        .accent {
            fill: none;
            stroke: var(--blue);
            stroke-width: 1.1;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .connector {
            stroke: var(--edge);
            stroke-width: 0.8;
            fill: none;
        }
        .pulse {
            fill: var(--blue);
            stroke: none;
        }
        footer {
            padding: 24px 5vw;
            font-size: 13px;
            color: #666;
        }
        @media (max-width: 800px) {
            .views {
                grid-template-columns: 1fr;
            }
            .view {
                padding: 24px 8px;
                min-height: 320px;
            }
        }
    </style>
    <header>
        <h1>Write once. Publish across your networks.</h1>
        <p>Illustration study · one source, three destinations</p>
    </header>
    <main class="views">
        <div class="view">
            <svg
                viewBox="0 0 640 390"
                role="img"
                aria-label="One source post connected to stacked versions for X, LinkedIn and Bluesky"></svg>
        </div>
        <div class="view dark">
            <svg
                viewBox="0 0 640 390"
                role="img"
                aria-label="The same source and destinations in the dark theme"></svg>
        </div>
    </main>
    <footer>
        Fixed isometric camera. Shared geometry for plates and connections. Reduced motion
        supported.
    </footer>
    <script type="module" src="./figure.js"></script>
</html>
