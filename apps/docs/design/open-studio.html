<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <title>Open studio — original demonstration poster</title>
    <style>
        @font-face {
            font-family: Host;
            src: url('../../../packages/ui/src/assets/fonts/host-grotesk.ttf');
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Host, sans-serif;
            background: #2457d6;
            color: #fff;
        }
        .poster {
            width: 1000px;
            height: 1200px;
            padding: 64px;
            display: flex;
            flex-direction: column;
        }
        .top {
            display: flex;
            justify-content: space-between;
            font-size: 26px;
        }
        .title {
            font-size: 214px;
            font-weight: 500;
            line-height: 0.93;
            letter-spacing: -0.045em;
            margin-top: 124px;
        }
        .title span {
            font-weight: 300;
        }
        .date {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 34px;
            line-height: 1.2;
        }
        .date strong {
            font-size: 122px;
            font-weight: 400;
            line-height: 1;
        }
        .bottom {
            margin-top: 48px;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <main class="poster">
        <div class="top"><span>Studio / Open doors</span><span>October 2026</span></div>
        <div class="title">OPEN<br /><span>STUDIO.</span></div>
        <div class="date">
            <strong>24.10</strong><span>Saturday<br />11:00–17:00</span>
        </div>
        <div class="bottom">
            <span>Meet the makers. See the collection.</span><span>Come as you are.</span>
        </div>
    </main>
</html>
