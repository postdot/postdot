name: Container candidate

on:
    workflow_dispatch:
        inputs:
            source_ref:
                description: Optional branch, tag, or commit to accept
                required: false
                type: string
            image_version:
                description: Optional release version baked into the candidate
                required: false
                type: string
            previous_image:
                description: Published image digest to upgrade from and restore with
                required: true
                default: ghcr.io/postdot/postdot@sha256:c345e86ab7995417b2a789e083fe262044c6132d5bb87edadd80337994e49ba3
                type: string
    workflow_call:
        inputs:
            source_ref:
                description: Commit, branch, or tag to build and accept
                required: true
                type: string
            image_version:
                description: Optional release version baked into the candidate
                required: false
                type: string
            previous_image:
                description: Published image digest to upgrade from and restore with
                required: true
                type: string

permissions:
    contents: read

jobs:
    candidate:
        name: Build and accept ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        env:
            POSTDOT_CONTAINER_TEST_IMAGE: postdot:candidate
            EXPECTED_ARCH: ${{ matrix.arch }}
        steps:
            - name: Check out selected source
              id: checkout
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ inputs.source_ref || github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            - name: Verify native Docker architecture
              run: test "$(docker version --format '{{.Server.Arch}}')" = "$EXPECTED_ARCH"

            - name: Build candidate without publication
              env:
                  IMAGE_VERSION: ${{ inputs.image_version }}
              run: |
                  docker build --platform "linux/$EXPECTED_ARCH" --tag "$POSTDOT_CONTAINER_TEST_IMAGE" \
                    --build-arg "POSTDOT_VERSION=$IMAGE_VERSION" \
                    --build-arg "POSTDOT_REVISION=${{ steps.checkout.outputs.commit }}" \
                    --label "org.opencontainers.image.version=$IMAGE_VERSION" \
                    --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                    --label "org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}" \
                    --label "org.opencontainers.image.licenses=AGPL-3.0-only" .

            - name: Verify candidate identity
              id: identity
              run: |
                  image_id="$(docker image inspect --format '{{.Id}}' "$POSTDOT_CONTAINER_TEST_IMAGE")"
                  platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")"
                  revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
                  test "$platform" = "linux/$EXPECTED_ARCH"
                  test "$revision" = "${{ steps.checkout.outputs.commit }}"
                  echo "image=$image_id" >> "$GITHUB_OUTPUT"
                  echo "platform=$platform" >> "$GITHUB_OUTPUT"

            - name: Verify packaged distribution sources and notices
              env:
                  CANDIDATE_IMAGE_ID: ${{ steps.identity.outputs.image }}
              run: |
                  docker run --rm --entrypoint bun \
                    --volume "$PWD/scripts/verify-container-distribution.ts:/tmp/verify-container-distribution.ts:ro" \
                    "$CANDIDATE_IMAGE_ID" /tmp/verify-container-distribution.ts

            - name: Verify offline bootstrap and packaged release identity
              run: python3 scripts/production-container-bootstrap.py --image "${{ steps.identity.outputs.image }}"

            - name: Verify the exact candidate image
              env:
                  POSTDOT_CONTAINER_TEST_IMAGE: ${{ steps.identity.outputs.image }}
              run: bun run test:container:recovery

            - name: Verify previous-release upgrade and backup restoration
              env:
                  CANDIDATE_IMAGE_ID: ${{ steps.identity.outputs.image }}
                  PREVIOUS_IMAGE: ${{ inputs.previous_image }}
              run: python3 scripts/production-container-upgrade.py --image "$CANDIDATE_IMAGE_ID" --previous-image "$PREVIOUS_IMAGE"

            - name: Record accepted candidate
              env:
                  CANDIDATE_IMAGE_ID: ${{ steps.identity.outputs.image }}
                  CANDIDATE_PLATFORM: ${{ steps.identity.outputs.platform }}
              run: |
                  {
                    echo '## Accepted container candidate'
                    echo "Source: ${{ steps.checkout.outputs.commit }}"
                    echo "Platform: $CANDIDATE_PLATFORM"
                    echo "Local image ID: $CANDIDATE_IMAGE_ID"
                    echo 'Container recovery and previous-release upgrade/restoration acceptance passed. No image was pushed; this is not a published release or a complete integration validation.'
                  } >> "$GITHUB_STEP_SUMMARY"
