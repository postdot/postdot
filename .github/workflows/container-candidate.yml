name: Container candidate

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    candidate:
        name: Build and accept ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        env:
            POSTBOT_CONTAINER_TEST_IMAGE: postbot:candidate
            EXPECTED_ARCH: ${{ matrix.arch }}
        steps:
            - name: Check out selected source
              uses: actions/checkout@v6.0.2

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            - name: Verify native Docker architecture
              run: test "$(docker version --format '{{.Server.Arch}}')" = "$EXPECTED_ARCH"

            - name: Build candidate without publication
              run: |
                  docker build --platform "linux/$EXPECTED_ARCH" --tag "$POSTBOT_CONTAINER_TEST_IMAGE" \
                    --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                    --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                    --label "org.opencontainers.image.licenses=AGPL-3.0-only" .

            - name: Verify candidate identity
              id: identity
              run: |
                  image_id="$(docker image inspect --format '{{.Id}}' "$POSTBOT_CONTAINER_TEST_IMAGE")"
                  platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")"
                  revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
                  test "$platform" = "linux/$EXPECTED_ARCH"
                  test "$revision" = "$GITHUB_SHA"
                  echo "image=$image_id" >> "$GITHUB_OUTPUT"
                  echo "platform=$platform" >> "$GITHUB_OUTPUT"

            - name: Verify the exact candidate image
              env:
                  POSTBOT_CONTAINER_TEST_IMAGE: ${{ steps.identity.outputs.image }}
              run: bun run test:container:recovery

            - name: Record accepted candidate
              env:
                  CANDIDATE_IMAGE_ID: ${{ steps.identity.outputs.image }}
                  CANDIDATE_PLATFORM: ${{ steps.identity.outputs.platform }}
              run: |
                  {
                    echo '## Accepted container candidate'
                    echo "Source: $GITHUB_SHA"
                    echo "Platform: $CANDIDATE_PLATFORM"
                    echo "Local image ID: $CANDIDATE_IMAGE_ID"
                    echo 'Container acceptance passed. No image was pushed; this is not a published release or a complete integration validation.'
                  } >> "$GITHUB_STEP_SUMMARY"
