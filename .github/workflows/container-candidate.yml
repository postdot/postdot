name: Container candidate

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    candidate:
        name: Build and accept ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        env:
            HERALD_CONTAINER_TEST_IMAGE: herald:candidate
        steps:
            - name: Check out selected source
              uses: actions/checkout@v6.0.2

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            - name: Verify native Docker architecture
              env:
                  EXPECTED_ARCH: ${{ matrix.arch }}
              run: test "$(docker version --format '{{.Server.Arch}}')" = "$EXPECTED_ARCH"

            - name: Build candidate without publication
              run: |
                  docker build --tag "$HERALD_CONTAINER_TEST_IMAGE" \
                    --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                    --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                    --label "org.opencontainers.image.licenses=AGPL-3.0-only" .

            - name: Verify the exact candidate image
              run: bun run test:container:recovery

            - name: Record accepted candidate
              env:
                  EXPECTED_ARCH: ${{ matrix.arch }}
              run: |
                  {
                    echo '## Accepted container candidate'
                    echo "Source: $GITHUB_SHA"
                    echo "Platform: linux/$EXPECTED_ARCH"
                    echo "Local image ID: $(docker image inspect --format '{{.Id}}' "$HERALD_CONTAINER_TEST_IMAGE")"
                    echo 'Container acceptance passed. No image was pushed; this is not a published release or a complete integration validation.'
                  } >> "$GITHUB_STEP_SUMMARY"
