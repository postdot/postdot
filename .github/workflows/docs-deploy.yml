name: Deploy documentation

on:
    push:
        branches:
            - main
        paths:
            - apps/docs/**
            - apps/api/**
            - packages/**
            - bun.lock
            - .github/workflows/docs-deploy.yml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6.0.2

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check deployment settings
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  POSTDOT_SITE_URL: ${{ vars.POSTDOT_SITE_URL }}
                  POSTDOT_UMAMI_URL: ${{ vars.POSTDOT_UMAMI_URL }}
                  POSTDOT_UMAMI_ID: ${{ vars.POSTDOT_UMAMI_ID }}
              run: |
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID POSTDOT_SITE_URL POSTDOT_UMAMI_URL POSTDOT_UMAMI_ID; do
                      if [ -z "${!name}" ]; then
                          echo "::error::$name is not set"
                          exit 1
                      fi
                  done

            - name: Build
              working-directory: apps/docs
              env:
                  POSTDOT_SITE_URL: ${{ vars.POSTDOT_SITE_URL }}
                  POSTDOT_UMAMI_URL: ${{ vars.POSTDOT_UMAMI_URL }}
                  POSTDOT_UMAMI_ID: ${{ vars.POSTDOT_UMAMI_ID }}
              run: bun run build

            - name: Deploy
              working-directory: apps/docs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bunx wrangler deploy
