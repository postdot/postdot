name: Publish n8n package

on:
    push:
        branches: [main]
        paths:
            - integrations/**
            - .github/workflows/n8n-publish.yml
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    pull-requests: write

concurrency:
    group: n8n-npm-publication
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: integrations
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org
                  cache: npm
                  cache-dependency-path: integrations/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm pack --workspace @postdot/n8n-nodes-postdot --dry-run
            - name: Create version pull request or publish through OIDC
              uses: changesets/action@v2
              with:
                  cwd: integrations
                  version-script: npm run version-packages
                  publish-script: npm run release
                  pr-title: 'chore(n8n): version package'
                  commit-message: 'chore(n8n): version package'
                  create-github-releases: false
