name: n8n package

on:
    pull_request:
        paths:
            - integrations/**
            - .github/workflows/n8n.yml
    push:
        branches: [main]
        paths:
            - integrations/**
            - .github/workflows/n8n.yml

permissions:
    contents: read

jobs:
    package:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: integrations
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: integrations/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm run changeset -- status
            - run: npm pack --workspace @postdot/n8n-nodes-postdot --dry-run
