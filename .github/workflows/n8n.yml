name: n8n package

on:
    pull_request:
        paths:
            - integrations/n8n/**
            - .github/workflows/n8n.yml
    push:
        branches: [main]
        paths:
            - integrations/n8n/**
            - .github/workflows/n8n.yml

permissions:
    contents: read

jobs:
    package:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: integrations/n8n
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: integrations/n8n/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm pack --dry-run
