name: npm packages

on:
    pull_request:
        paths:
            - integrations/**
            - packages/cli/**
            - packages/client/**
            - integrations/tests/release.test.ts
            - scripts/qualify-public-cli.ts
            - scripts/cli-qualification-*.ts
            - scripts/cli-completion-*
            - scripts/cli-publication-acceptance.ts
            - bun.lock
            - package.json
            - .github/workflows/n8n.yml
    push:
        branches: [main]
        paths:
            - integrations/**
            - packages/cli/**
            - packages/client/**
            - integrations/tests/release.test.ts
            - scripts/qualify-public-cli.ts
            - scripts/cli-qualification-*.ts
            - scripts/cli-completion-*
            - scripts/cli-publication-acceptance.ts
            - bun.lock
            - package.json
            - .github/workflows/n8n.yml

permissions:
    contents: read

jobs:
    package:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: integrations
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: integrations/package-lock.json
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json
            - run: npm ci --ignore-scripts
            - name: Install completion acceptance shells
              run: |
                  for source in /etc/apt/sources.list.d/google-chrome.*; do
                    if [ -f "$source" ]; then sudo rm -f "$source"; fi
                  done
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends zsh fish
            - name: Install and check CLI source
              working-directory: .
              run: |
                  bun install --frozen-lockfile
                  bun run --cwd packages/cli typecheck
                  bun run --cwd packages/cli lint
                  bun run --cwd packages/cli test
                  bunx oxlint --deny-warnings integrations/scripts integrations/cli/scripts integrations/n8n/scripts integrations/tests
                  bun test integrations/tests/release.test.ts
                  bun run scripts/qualify-public-cli.ts --shell-completion
            - name: Qualify public CLI against published servers
              working-directory: .
              run: |
                  bun run scripts/qualify-public-cli.ts --released --image ghcr.io/postdot/postdot@sha256:4aed12e94996cc75a258ea50d6eeb3da41b0cff08151f987251626ebe42c7931
                  bun run scripts/qualify-public-cli.ts --released --image ghcr.io/postdot/postdot@sha256:92321cb2a782b8c06c679b71b511185d6575d432a2a1d84a737952dd525d4ab1
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm run changeset -- status --since origin/main
            - run: npm run prepare:cli
            - run: npm run pack:release
