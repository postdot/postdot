services:
    herald:
        image: herald:local
        build:
            context: .
        init: true
        restart: unless-stopped
        stop_grace_period: 30s
        ports:
            - '127.0.0.1:${HERALD_HTTP_PORT:-3000}:3000'
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: '3000'
            DB_FILE_NAME: /data/herald.sqlite
            HERALD_MIGRATIONS_DIR: /app/migrations
            HERALD_WEB_ASSETS_DIR: /app/public
            HERALD_MEDIA_DIRECTORY: /data/media
            LOG_PRETTY: 'false'
        volumes:
            - herald-data:/data

volumes:
    herald-data:
